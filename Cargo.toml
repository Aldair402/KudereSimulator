[workspace]
resolver = "2"
members = [
    "crates/kud_core",
    "crates/kud_ecs",
    "crates/kud_asset",
    "crates/kud_render",
    "crates/kud_sim",
    "crates/kud_engine",
    "crates/kud_runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
